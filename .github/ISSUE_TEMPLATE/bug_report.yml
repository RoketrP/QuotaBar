name: Bug 报告
description: 报告可复现的 QuotaBar 问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿提交密码、Cookie、ChatGPT 登录令牌或其他敏感信息。
  - type: input
    id: version
    attributes:
      label: QuotaBar 版本
      description: 可在 Release 文件名或 App 信息中查看。
      placeholder: 例如 1.1.0 (2)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS 与 Mac 型号
      placeholder: 例如 macOS 15.6，MacBook Air M2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动 QuotaBar
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 补充信息
      description: 可附不包含账户和令牌信息的截图或日志。
